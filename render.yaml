services:
  - type: web
    name: pulseflow-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --prefix server && DATABASE_URL=postgresql://x:x@localhost/x ./server/node_modules/.bin/prisma generate --schema=server/prisma/schema.prisma
    startCommand: ./server/node_modules/.bin/prisma db push --schema=server/prisma/schema.prisma && node server/prisma/seed.js && node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: pulseflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: pulseflow-db
    databaseName: pulseflow
    plan: free
    region: oregon
