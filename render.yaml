services:
  - type: web
    name: pulseflow-api
    env: node
    plan: free
    region: oregon
    buildCommand: >-
      node -e "var fs=require('fs'),f='server/prisma/schema.prisma',c=fs.readFileSync(f,'utf8').replace('sqlite','postgresql');fs.writeFileSync(f,c)" &&
      DATABASE_URL=postgresql://x:x@localhost/x npm install --prefix server
    startCommand: ./server/node_modules/.bin/prisma db push --schema=server/prisma/schema.prisma; node server/prisma/seed.js; node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: pulseflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: pulseflow-db
    databaseName: pulseflow
    plan: free
    region: oregon
