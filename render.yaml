services:
  - type: web
    name: pulseflow-api
    env: node
    plan: free
    region: oregon
    buildCommand: cd server && npm install && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: pulseflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: pulseflow-db
    databaseName: pulseflow
    plan: free
    region: oregon
